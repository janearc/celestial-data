# numbers.yaml: the numbers celestial-data picks for a call that does not give
# them, by name. A flag of the same name takes a number's place, except
# for the numbers of a named set, which no flag takes the place of.

numbers:
  - name: most
    value: 5
    unit: observations
    says: how many observations nustar and chandra find a search, the longest first; five held the deep looks at Sgr A* on the night of the page
    kind: picked
    by: celestial-data's command, 2026-11-02
  - name: pixels
    value: 1024
    unit: pixels
    says: how many pixels a side a hips cutout is drawn at; at a tenth of a degree's radius that is under an arcsecond a pixel
    kind: picked
    by: celestial-data's command, 2026-11-02
  - name: grissom-radius
    value: 0.1
    unit: degrees
    says: how far round Sgr A* the grissom set asks the archives; it reaches the one Glimpse tile that holds the centre. No flag takes its place
    kind: picked
    by: celestial-data's command, for the Sgr A* page of 2026-11-01; celestial-data's README asks the same circle
  - name: grissom-sky-width
    value: 3600
    unit: pixels
    says: how many pixels across the Mellinger, H-alpha and 408 MHz whole-sky maps of the grissom set are drawn by SkyView. No flag takes its place
    kind: picked
    by: celestial-data's command, 2026-11-02, as the maps fetched for the grissom viewer were
  - name: grissom-iris-width
    value: 1800
    unit: pixels
    says: how many pixels across the IRIS 100 micron whole-sky map of the grissom set is drawn by SkyView. No flag takes its place
    kind: picked
    by: celestial-data's command, 2026-11-02, as the map fetched for the grissom viewer was
  - name: wait
    value: 120
    unit: seconds
    says: >-
      how long an archive is given to connect and begin its answer;
      HEASARC took several seconds to begin on 2026-11-01, and Chandra
      seventeen seconds to answer a HEAD. SkyView's whole-sky IRIS 100
      query took 74 seconds to send its first byte on 2026-11-02,
      exceeding the earlier 30-second limit
    kind: picked
    by: celestial-data's command, 2026-11-02, from the live Grissom download check
  - name: dasch-whole
    value: 60
    unit: seconds
    says: how long the dasch archive gives DASCH's Starglass API for the whole of one answer, from asking to the last byte; a light curve is a line of CSV a plate, and the one fetched on 2026-11-08 for a star on 2820 plates was 413 kilobytes, so a minute is generous, and a question that hangs is let go
    kind: picked
    by: celestial-data's command, 2026-11-08
  - name: job-every
    value: 30
    unit: seconds
    says: how long fetch waits between asking after a job, such as the gaia archive's; the end of a job is seen within half a minute, and two hours of asking is 240 asks
    kind: picked
    by: celestial-data's command, 2026-11-05
  - name: job-asks
    value: 300
    unit: asks
    says: how many times fetch asks after a job before giving up on it; at job-every that is two and a half hours, past the gaia archive's two hours for a signed-in user's job, by its quota page read 2026-11-05
    kind: picked
    by: celestial-data's command, 2026-11-05
  - name: arxiv-pace
    value: 3
    unit: seconds
    says: how long papers lets pass from the start of one request to arXiv to the start of the next, for its API and its PDFs alike, one at a time, and from one run to the next, for this user on this machine, through the gate's record; arXiv's own least, which the arxiv package will not go under. No flag takes its place
    kind: picked
    by: celestial-data's command papers fetched gently
  - name: arxiv-most
    value: 20
    unit: ids
    says: how many ids papers asks arXiv's API about in one query; fewer queries are gentler, and twenty keeps the address short. No flag takes its place
    kind: picked
    by: celestial-data's command, 2026-11-06
  - name: ads-most
    value: 20
    unit: papers
    says: how many papers the ads verb shows of a search, the newest first; a page to read at once, from one request however many match
    kind: picked
    by: celestial-data's command, 2026-11-06
  - name: ads-whole
    value: 30
    unit: seconds
    says: how long the ads verb gives ADS for its whole answer, from asking to the last byte; a page of a few dozen papers is a few kilobytes of JSON, so half a minute is generous, and a search that hangs is let go
    kind: picked
    by: celestial-data's command, 2026-11-06
  - name: ntrs-most
    value: 20
    unit: citations
    says: how many citations the ntrs verb shows of a search, in NTRS's order; a page to read at once, from one request however many match. NTRS gives at most a hundred
    kind: picked
    by: celestial-data's command, 2026-11-11
  - name: ntrs-whole
    value: 30
    unit: seconds
    says: how long the ntrs and ntrs-fetch verbs give NTRS for the whole of an answer to a search or a citation, from asking to the last byte; a page of citations is some tens of kilobytes of JSON, so half a minute is generous, and a request that hangs is let go. A PDF is not held to it, but to ntrs-pdf-whole
    kind: picked
    by: celestial-data's command, 2026-11-11
  - name: ntrs-pdf-whole
    value: 1800
    unit: seconds
    says: how long ntrs-fetch gives NTRS for the whole of one PDF, from asking to the last byte, half an hour; a large scanned report may be some hundreds of megabytes, a guess not yet measured, and at that size half an hour allows a slow link, while a download that stalls for ever is let go
    kind: picked
    by: celestial-data's command, 2026-11-11
  - name: ntrs-pdf-most
    value: 2147483648
    unit: bytes
    says: the most bytes one PDF fetched by ntrs-fetch may hold, 2 GiB. A file that says it is longer is refused unread, and one that comes longer is cut off and not kept, so a server that never stops cannot fill the disk. Picked well above a large scanned report, a guess not yet measured
    kind: picked
    by: celestial-data's command, 2026-11-11
