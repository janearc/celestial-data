  - name: hydrogen-overa
    value: 0.99212
    unit: "none"
    says: the mean ratio of atomic number to mass NIST assumed for hydrogen
    kind: measured
    source:
      key: nist-tab1
      where: hydrogen's row of Table 1, the table's first, Z 1
      text: "1 H Hydrogen 0.99212 19.2 8.375E-05"
  - name: hydrogen-density
    value: 0.00008375
    unit: g/cm^3
