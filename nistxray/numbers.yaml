  # The material constants of lead and water, Table 1 and Table 2.
  - name: lead-overa
    value: 0.39575
    unit: "none"
    says: the mean ratio of atomic number to mass NIST assumed for lead
    kind: measured
    source:
      key: nist-tab1
      where: lead's row of Table 1, Z 82
      text: "82 Pb Lead 0.39575 823.0 1.135E+01"
  - name: lead-density
    value: 11.35
    unit: g/cm^3
    says: the density NIST assumed for lead
    kind: measured
    source:
      key: nist-tab1
      where: lead's row of Table 1, Z 82
      text: "82 Pb Lead 0.39575 823.0 1.135E+01"
  - name: water-overa
    value: 0.55508
    unit: "none"
    says: the mean ratio of atomic number to mass NIST assumed for water
    kind: measured
    source:
      key: nist-tab2
      where: water's row of Table 2
      text: "Water, Liquid 0.55508 75.0 1.000E+00"
  - name: water-density
    value: 1.0
    unit: g/cm^3
    says: the density NIST assumed for water
    kind: measured
    source:
      key: nist-tab2
      where: water's row of Table 2
      text: "Water, Liquid 0.55508 75.0 1.000E+00"

  # The first rows of the two tables, which the pages lay out with
