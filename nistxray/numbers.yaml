# numbers.yaml: the values of the data the nistxray tests quote, read
# from the pages themselves, not from our own choosing. The pins of
# the pages (their lengths and the sums of their content) are in
# manifest.yaml; the sources are in sources.yaml.

numbers:
  # Lead, ElemTab/z82.html, the page the tests read in full detail.
  - name: lead-rows
    value: 58
    unit: rows
    says: the rows of lead's table of coefficients
    kind: measured
    source:
      key: nist-z82
      where: the rows of the page's ASCII table, lines 445 to 502
      text: "58 rows, from 1.00000E-03 to 2.00000E+01 MeV"
  - name: lead-first-energy
    value: 0.001
    unit: MeV
    says: the energy of lead's first row
    kind: measured
    source:
      key: nist-z82
      where: line 445 of the page's ASCII table, its first row
      text: "1.00000E-03  5.210E+03  5.197E+03"
  - name: lead-first-mu
    value: 5210
    unit: cm^2/g
    says: the mass attenuation coefficient of lead's first row
    kind: measured
    source:
      key: nist-z82
      where: line 445 of the page's ASCII table, its first row
      text: "1.00000E-03  5.210E+03  5.197E+03"
  - name: lead-first-muen
    value: 5197
    unit: cm^2/g
    says: the mass energy-absorption coefficient of lead's first row
    kind: measured
    source:
      key: nist-z82
      where: line 445 of the page's ASCII table, its first row
      text: "1.00000E-03  5.210E+03  5.197E+03"
  - name: lead-second-energy
    value: 0.0015
    unit: MeV
    says: the energy of lead's second row
    kind: measured
    source:
      key: nist-z82
      where: line 446 of the page's ASCII table, its second row
      text: "1.50000E-03  2.356E+03  2.344E+03"
  - name: lead-second-mu
    value: 2356
    unit: cm^2/g
    says: the mass attenuation coefficient of lead's second row
    kind: measured
    source:
      key: nist-z82
      where: line 446 of the page's ASCII table, its second row
      text: "1.50000E-03  2.356E+03  2.344E+03"
  - name: lead-second-muen
    value: 2344
    unit: cm^2/g
    says: the mass energy-absorption coefficient of lead's second row
    kind: measured
    source:
      key: nist-z82
      where: line 446 of the page's ASCII table, its second row
      text: "1.50000E-03  2.356E+03  2.344E+03"
  - name: lead-k-edge-energy
    value: 0.0880045
    unit: MeV
    says: the energy of lead's K-edge row, at the K absorption edge
    kind: measured
    source:
      key: nist-z82
      where: line 482 of the page's ASCII table, the row labelled K
      text: "K  8.80045E-02  7.683E+00  2.160E+00"
  - name: lead-k-edge-mu
    value: 7.683
    unit: cm^2/g
    says: the mass attenuation coefficient of lead's K-edge row
    kind: measured
    source:
      key: nist-z82
      where: line 482 of the page's ASCII table, the row labelled K
      text: "K  8.80045E-02  7.683E+00  2.160E+00"
  - name: lead-k-edge-muen
    value: 2.16
    unit: cm^2/g
    says: the mass energy-absorption coefficient of lead's K-edge row
    kind: measured
    source:
      key: nist-z82
      where: line 482 of the page's ASCII table, the row labelled K
      text: "K  8.80045E-02  7.683E+00  2.160E+00"
  - name: lead-last-energy
    value: 20
    unit: MeV
    says: the energy of lead's last row
    kind: measured
    source:
      key: nist-z82
      where: line 502 of the page's ASCII table, its last row
      text: "2.00000E+01  6.206E-02  3.595E-02"
  - name: lead-last-mu
    value: 0.06206
    unit: cm^2/g
    says: the mass attenuation coefficient of lead's last row
    kind: measured
    source:
      key: nist-z82
