# numbers.yaml: what arXiv asks of a program that fetches from it, read
# from its own pages. The sources are in sources.yaml.

numbers:
  - name: least-pace
    value: 3
    unit: seconds
    says: the least time from the start of one request to arXiv to the start of the next, one request at a time, for all of a caller's machines together. The terms set it for the arXiv API; this package holds every request to arXiv to it for one user on one machine, the PDFs too, and from one run to the next through the gate's record, which is gentler than its terms ask for the PDFs. Other machines it cannot see
    kind: measured
    source:
      key: arxiv-api-terms
      where: Limitations, Rate limits
      text: "When using the legacy APIs (including OAI-PMH, RSS, and the arXiv API), make no more than one request every three seconds, and limit requests to a single connection at a time."
  - name: rest-unsaid
    value: 300
    unit: seconds
    says: how long the gate leaves arXiv alone after arXiv asked it to stop without a Retry-After saying how long; arXiv's pages give no number for this
    kind: picked
    by: celestial-data's arxiv package, papers should be fetched gently
  - name: tries
    value: 0
    unit: attempts
    says: how many times more a request to arXiv is asked after a failure with no word from arXiv, such as a timeout or a 503 with no Retry-After. None, so a failed request is not asked again, as this adapter has always done. This keeps arXiv asked once and never stopped by a circuit, as before. The web package's default is three
    kind: picked
    by: celestial-data's arxiv package, so arXiv's behaviour is the one it had before it used the web package's gentle
  - name: opens
    value: 0
    unit: requests
    says: how many requests in a row may fail with no word from arXiv before it is left alone for the rest of the run. None means never, so arXiv is always asked, however many fail, as this adapter has always done. This keeps arXiv asked once and never stopped by a circuit, as before. The web package's default is two
    kind: picked
    by: celestial-data's arxiv package, so arXiv's behaviour is the one it had before it used the web package's gentle
