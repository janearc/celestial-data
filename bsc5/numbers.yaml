    source:
      key: bsc5-readme
      where: the byte-by-byte description of the catalogue
      text: "  85- 86  I2     deg     DEd      ?Degrees Dec, equinox J2000, epoch 2000.0 (1)"
  - name: dec-degrees-last
    value: 86
    unit: byte
    says: the last byte of the degrees of declination, J2000
    kind: measured
    source:
      key: bsc5-readme
      where: the byte-by-byte description of the catalogue
      text: "  85- 86  I2     deg     DEd      ?Degrees Dec, equinox J2000, epoch 2000.0 (1)"
  - name: dec-minutes-first
    value: 87
    unit: byte
    says: the first byte of the minutes of declination, J2000
    kind: measured
    source:
      key: bsc5-readme
      where: the byte-by-byte description of the catalogue
      text: "  87- 88  I2     arcmin  DEm      ?Minutes Dec, equinox J2000, epoch 2000.0 (1)"
  - name: dec-minutes-last
    value: 88
    unit: byte
    says: the last byte of the minutes of declination, J2000
    kind: measured
    source:
      key: bsc5-readme
      where: the byte-by-byte description of the catalogue
      text: "  87- 88  I2     arcmin  DEm      ?Minutes Dec, equinox J2000, epoch 2000.0 (1)"
  - name: dec-seconds-first
    value: 89
    unit: byte
    says: the first byte of the seconds of declination, J2000
    kind: measured
    source:
      key: bsc5-readme
      where: the byte-by-byte description of the catalogue
      text: "  89- 90  I2     arcsec  DEs      ?Seconds Dec, equinox J2000, epoch 2000.0 (1)"
  - name: dec-seconds-last
    value: 90
    unit: byte
    says: the last byte of the seconds of declination, J2000
