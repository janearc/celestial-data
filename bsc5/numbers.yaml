  - name: visual-first
    value: 103
    unit: byte
    says: the first byte of the visual magnitude
    kind: measured
    source:
      key: bsc5-readme
      where: the byte-by-byte description of the catalogue
      text: " 103-107  F5.2   mag     Vmag     ?Visual magnitude (1)"
  - name: visual-last
    value: 107
    unit: byte
    says: the last byte of the visual magnitude
    kind: measured
    source:
      key: bsc5-readme
