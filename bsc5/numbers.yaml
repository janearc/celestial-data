    unit: byte
    says: the first byte of the spectral type
    kind: measured
    source:
      key: bsc5-readme
      where: the byte-by-byte description of the catalogue
      text: " 128-147  A20    ---     SpType   Spectral type"
  - name: spectral-last
    value: 147
    unit: byte
    says: the last byte of the spectral type
